/* 启动时从 _pouch_config 读取 COLOR_MODE，给 body 打标，供深色全局主题使用。
   indexedDB.open 不带版本号时，若库不存在会创建一个 v1 空库（无对象仓库），
   这会导致 PouchDB 之后无法初始化配置库（配置读写全部失败、COLOR_MODE 丢失）。
   因此先探测库是否存在；发现被污染的空库则删除，让 PouchDB 重建。 */
(function () {
    try {
        if (!indexedDB.databases) return;
        indexedDB.databases().then(function (dbs) {
            if (!dbs.some(function (d) { return d.name === '_pouch_config'; })) return;
            var req = indexedDB.open('_pouch_config');
            req.onsuccess = function () {
                var db = req.result;
                if (!db.objectStoreNames.contains('document-store') || !db.objectStoreNames.contains('by-sequence')) {
                    db.close();
                    indexedDB.deleteDatabase('_pouch_config');
                    return;
                }
                var tx = db.transaction(['document-store', 'by-sequence'], 'readonly');
                var metaReq = tx.objectStore('document-store').get('COLOR_MODE');
                metaReq.onsuccess = function () {
                    var winning = null;
                    try { winning = metaReq.result && JSON.parse(metaReq.result.data).winningRev; } catch (e) {}
                    var allReq = tx.objectStore('by-sequence').getAll();
                    allReq.onsuccess = function () {
                        var rows = allReq.result.filter(function (r) {
                            return r._doc_id_rev && r._doc_id_rev.indexOf('COLOR_MODE::') === 0;
                        });
                        var doc = rows.filter(function (r) { return r._doc_id_rev.split('::')[1] === winning; })[0] || rows[rows.length - 1];
                        if (doc && doc.value) document.body.setAttribute('data-color-mode', doc.value);
                    };
                };
            };
        });
    } catch (e) {}
})();

/* 章节切换后正文 DOM 重建导致滚动容器失焦，显式接管方向键滚动 */
window.addEventListener('keydown', function (e) {
    if (!location.hash.startsWith('#/read/')) return;
    if (document.activeElement !== document.body) return;
    var scroller = document.querySelector('.read-screen');
    if (!scroller) return;
    var step = 0;
    if (e.key === 'ArrowUp') step = -40;
    else if (e.key === 'ArrowDown') step = 40;
    else if (e.key === 'PageUp') step = -scroller.clientHeight * 0.9;
    else if (e.key === 'PageDown') step = scroller.clientHeight * 0.9;
    else return;
    e.preventDefault();
    scroller.scrollBy(0, step);
}, true);
</script><script>
